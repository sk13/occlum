[package]
name = "occlum_ratls"
version = "0.1.0"
authors = ["Zheng Qi huaiqing.zq@antgroup.com"]
edition = "2021"

[dependencies]
base64 = "0.23"
bytes = "1"
h2 = "0.4"
http = "1"
occlum_dcap = { path = "../toolchains/dcap_lib" }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.18"
